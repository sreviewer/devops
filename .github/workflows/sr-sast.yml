# Demo workflow: checks out the repo, runs the SR SAST scan on ./src, uploads the SARIF to
# GitHub Code Scanning (Security tab - requires GitHub Advanced Security on private repos, always
# available on public repos), and publishes the HTML report, raw results AND the official
# SRReport PDF/DOC/XLS documents as a downloadable artifact for the full graphical drill-down.
name: SR SAST Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write # required by upload-sarif

jobs:
  sr-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SR SAST scan
        id: sr-sast
        # Referencing this same repo's action by relative path for the demo; in a real deployment
        # reference the published action instead, e.g. uses: security-reviewer/sr-sast-action@v1
        uses: docker://ghcr.io/sreviewer/sr-sast-action:1.0.5
        continue-on-error: true # let the follow-up steps run even on FAILURE/UNSTABLE
        with:
          application: "MyApp"
          version: ${{ github.sha }}
          path: "./src"
          generate_reports: "true"
          report_types: "det,deadcode,sqale"
          threshold_fail_blocker: "0"
          threshold_unstable_critical: "0"
          continue_on_unstable: "true"
          sonar_report: "true"
          ticket_system: "jira"
          ticket_url: "http://172.17.0.1:18780"
          ticket_user: "ci@example.com"
          ticket_token: "demo-ticket-token"
          ticket_project: "SEC"
          ticket_min_severity: "Major"

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.sr-sast.outputs.sarif-path }}

      - name: Upload HTML report + raw results + official PDF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr-sast-report
          path: |
            ${{ steps.sr-sast.outputs.html-path }}
            ${{ steps.sr-sast.outputs.results-dir }}
            ${{ steps.sr-sast.outputs.reports-dir }}

      - name: Show what the mock Jira received
        if: always()
        run: cat "$RUNNER_TEMP/mock-jira.log" || true

      - name: Fail the job if the scan itself failed
        if: steps.sr-sast.outputs.verdict == 'FAILURE'
        run: exit 1
